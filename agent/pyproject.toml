[project]
name = "capture-agent"
version = "0.1.0"
requires-python= ">=3.12"
dependencies = [
  "confluent-kafka>=2.5", "protobuf>=5", "pydantic-settings>=2",
  "typer>=0.12", "httpx>=0.27", "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs real services; set TEST_DATABASE_URL and/or TEST_KAFKA_BOOTSTRAP",
]
